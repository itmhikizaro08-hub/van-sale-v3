{% extends 'base.html' %}{% block title %}Add Expense{% endblock %}{% block content %}
<div class="page-header"><h1 class="page-title">Add Expense</h1></div>
<div class="row justify-content-center"><div class="col-md-6">
<form method="POST" enctype="multipart/form-data"><div class="card"><div class="card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Expense Date *</label><input type="date" name="expense_date" class="form-control" value="{{ today }}" required></div>
    <div class="col-md-6"><label class="form-label">Category *</label>
      <select name="category" class="form-select" required>
        {% for c in categories %}<option value="{{ c.key }}">{{ c.label }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Amount (GHS) *</label><div class="input-group"><span class="input-group-text">GHS</span><input type="number" name="amount" class="form-control" step="0.01" min="0.01" required></div></div>
    <div class="col-md-6"><label class="form-label">Payment Method *</label>
      <select name="payment_method" class="form-select" required>
        {% for key, label in payment_methods %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2" placeholder="What was this expense for?"></textarea></div>
    <div class="col-12"><label class="form-label"><i class="fas fa-book text-info me-1"></i>Notes</label><input type="text" name="reference_note" class="form-control" placeholder="e.g. Receipt #45, cross-reference to physical records"></div>
    <div class="col-12"><label class="form-label"><i class="fas fa-camera text-info me-1"></i>Receipt (image or PDF)</label><input type="file" name="receipt_image" class="form-control" accept="image/*,.pdf"></div>
  </div>
</div><div class="card-footer d-flex gap-2">
  <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Submit Expense</button>
  <a href="{{ url_for('expenses.index') }}" class="btn btn-outline-secondary">Cancel</a>
</div></div></form>
</div></div>
{% endblock %}
