{% extends 'base.html' %}{% block title %}Edit Expense{% endblock %}{% block content %}
<div class="page-header"><h1 class="page-title">Edit Expense — {{ expense.expense_number }}</h1></div>
<div class="row justify-content-center"><div class="col-md-6">
<form method="POST" enctype="multipart/form-data"><div class="card"><div class="card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Expense Date *</label><input type="date" name="expense_date" class="form-control" value="{{ expense.expense_date.strftime('%Y-%m-%d') if expense.expense_date else '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Category *</label>
      <select name="category" class="form-select" required>
        {% for c in categories %}<option value="{{ c.key }}" {{ 'selected' if c.key == expense.category }}>{{ c.label }}</option>{% endfor %}
        {% if expense.category not in categories|map(attribute='key')|list %}
        <option value="{{ expense.category }}" selected>{{ expense.category|replace('_',' ')|title }} (inactive)</option>
        {% endif %}
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Amount (GHS) *</label><div class="input-group"><span class="input-group-text">GHS</span><input type="number" name="amount" class="form-control" step="0.01" min="0.01" value="{{ expense.amount }}" required></div></div>
    <div class="col-md-6"><label class="form-label">Payment Method *</label>
      <select name="payment_method" class="form-select" required>
        {% for key, label in payment_methods %}<option value="{{ key }}" {{ 'selected' if key == expense.payment_method }}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2">{{ expense.description or '' }}</textarea></div>
    <div class="col-12"><label class="form-label"><i class="fas fa-book text-info me-1"></i>Notes</label><input type="text" name="reference_note" class="form-control" value="{{ expense.reference_note or '' }}"></div>
    <div class="col-12"><label class="form-label"><i class="fas fa-camera text-info me-1"></i>Receipt (image or PDF)</label><input type="file" name="receipt_image" class="form-control" accept="image/*,.pdf">
      {% if expense.receipt_image %}<div class="form-text"><a href="{{ url_for('misc.uploads', filename=expense.receipt_image) }}" target="_blank"><i class="fas {{ 'fa-file-pdf' if expense.receipt_is_pdf else 'fa-image' }} me-1"></i>View current receipt</a> — leave blank to keep it.</div>{% endif %}
    </div>
  </div>
</div><div class="card-footer d-flex gap-2">
  <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Changes</button>
  <a href="{{ url_for('expenses.view', expense_id=expense.id) }}" class="btn btn-outline-secondary">Cancel</a>
</div></div></form>
</div></div>
{% endblock %}
